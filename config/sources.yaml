# Agencies to sweep each week. Onboard a site with a coding agent + Playwright CLI, then set
# enabled: true. See README "Adding an agency".

sources:
  - name: ray-white-sutherland-shire
    agency: Ray White Sutherland Shire
    adapter: raywhite
    list_urls: [https://raywhitesutherlandshire.com.au]
    options:
      organisation_ids: [1676, 2098, 2368, 2980, 840]   # from window.INITIAL_STATE.config.organisationIds
    notes: >
      Shared Ray White listings API via /api/proxy/v1/listings. Status OFF (withdrawn or not
      publicly marketed) is reported as off-market. No off-market sign-up page on the site.

  - name: pulse
    agency: Pulse Property Agents
    adapter: pulse
    list_urls: [https://www.pulseproperty.com.au]
    via_home_proxy: true   # Cloudflare blocks GitHub's IPs; see docs/home-proxy.md
    notes: >
      /wp-json/api/listings/all. Off-market ("Pre-Market") listings have hidden addresses; register
      the alerts Gmail at /off-market/ and /property-alerts/ to get them by email.

  - name: fox-and-wood
    agency: Fox & Wood
    adapter: eview
    list_urls: [https://foxandwood.com.au]
    via_home_proxy: true   # Cloudflare, same hosting as Pulse
    options:
      office_id: 1496      # guards against the feed returning every eview office
    notes: >
      Pulse's endpoint with eview fields; needs the PageFrom header. Off-market and coming-soon
      listings come from their own statuses. Newsletter sign-up in the site footer.

  - name: the-agency-sutherland-shire
    agency: The Agency Sutherland Shire
    adapter: pushcreative
    list_urls: ["https://theagency.com.au/properties-for-sale?office=250"]
    notes: All listings on one page. No off-market page or alert sign-up.

  - name: century-21-sutherland-shire
    agency: Century 21 Sutherland Shire
    adapter: pushcreative
    list_urls: [https://c21sutherlandshire.com.au/properties-for-sale]
    notes: Office in Menai, so mostly suburbs outside the list. robots.txt asks for 5 s between requests.

  # ---- to onboard ----
  - {name: kore, agency: KORE Property Group, enabled: false}
  - {name: one-agency-engadine, agency: One Agency Engadine, enabled: false}
  - {name: one-agency-the-shire, agency: One Agency The Shire, enabled: false}
