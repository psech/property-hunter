  - {name: sanders, agency: Sanders Property Agents, enabled: false}
  - {name: highland, agency: Highland Property Group, enabled: false}
  - {name: watkins, agency: Watkins Real Estate, enabled: false}
  - {name: sutherland-shire-property-agents, agency: Sutherland Shire Property Agents, enabled: false}
