[project]
name = "property-hunter"
version = "0.1.0"
description = "Weekly research pipeline for Sutherland Shire property listings near Kirrawee High School"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdownify>=0.13",
    "playwright>=1.47",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "selectolax>=1.0",
]

[project.scripts]
hunter = "hunter.main:main"
hunter-gmail-auth = "hunter.gmail_auth:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
